name: Benchmark Submission
description: Submit an OpenLLMWorks benchmark package for maintainer review.
title: "[Benchmark Submission]: "
labels:
  - benchmark-submission

body:
  - type: markdown
    attributes:
      value: |
        # OpenLLMWorks Benchmark Submission

        Thank you for contributing benchmark data to OpenLLMWorks.

        The preferred submission method is the OpenLLMWorks Runner.
        A successful Runner session automatically validates the completed
        submission before creating the upload-ready ZIP package.

        If you created the submission manually, validate it from the
        repository root before submitting:

        `python -m parser.validate <submission>`

        Attach the complete OpenLLMWorks submission ZIP below.
        A maintainer will independently validate the package before import.

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Enter the GPU used for this benchmark.
      placeholder: NVIDIA GeForce GTX 1660 Ti
    validations:
      required: true

  - type: dropdown
    id: submission_method
    attributes:
      label: Submission method
      description: How was this benchmark package created?
      options:
        - OpenLLMWorks Runner
        - Manual / advanced workflow
    validations:
      required: true

  - type: textarea
    id: package
    attributes:
      label: Submission package
      description: >
        Drag and drop the complete OpenLLMWorks submission ZIP into this field.
        If you used the Runner, attach the upload-ready ZIP it generated.
      placeholder: Drag your submission ZIP file here.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: >
        Add anything that may help maintainers review this benchmark,
        including unusual behavior, hardware modifications, or Runner issues.
        This field is optional.
      placeholder: Optional notes about the system, benchmark run, or submission.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checklist
      options:
        - label: The attached ZIP is the complete submission package produced or validated for this benchmark.
          required: true
        - label: I have not intentionally modified the raw benchmark output or hardware evidence.
          required: true
        - label: I understand that maintainers will independently validate this submission before import.
          required: true
        - label: I understand that maintainers may request changes before accepting this benchmark.
          required: true
