name: Import Approved Submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Approved OpenLLMWorks submission ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-approved-submission:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: openllmworks-submissions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical modules
        run: |
          python -c "import parser.validate; print('Canonical submission validator module found.')"
          python -c "import parser.submission_archive; print('Submission archive module found.')"

      - name: Verify AWS CLI
        run: aws --version

      - name: Validate submission ID
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          if [[ ! "$SUBMISSION_ID" =~ ^sub_[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Invalid submission ID: $SUBMISSION_ID"
            exit 1
          fi

          echo "Submission ID format is valid."

      - name: Download approved submission from R2
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          mkdir -p import_work

          aws s3 cp \
            "s3://$R2_BUCKET/incoming/$SUBMISSION_ID.zip" \
            "import_work/submission.zip" \
            --endpoint-url "$R2_ENDPOINT"

          test -s import_work/submission.zip
          echo "Submission ZIP downloaded successfully."

      - name: Safely extract submission
        id: extract
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from parser.submission_archive import extract_submission_archive

          archive_path = Path("import_work/submission.zip")
          extract_root = Path("import_work/extracted")

          result = extract_submission_archive(
              archive_path,
              extract_root,
          )

          submission_dir = result.submission_dir.resolve()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"submission_dir={submission_dir}\n")

          print(f"Safely extracted submission to: {submission_dir}")
          PY

      - name: Run canonical validation
        env:
          SUBMISSION_DIR: ${{ steps.extract.outputs.submission_dir }}
        run: |
          python -m parser.validate "$SUBMISSION_DIR"

          echo
          echo "OpenLLMWorks canonical validation PASSED."

      - name: Run canonical maintainer import
        env:
          SUBMISSION_DIR: ${{ steps.extract.outputs.submission_dir }}
        run: |
          python scripts/process_submission.py "$SUBMISSION_DIR" \
            --source-type direct_submission \
            --contributor-id founder_000001 \
            --contributor-type founder \
            --verification-status maintainer_verified

          echo
          echo "Canonical maintainer workflow completed."

      - name: Verify generated change allowlist
        run: |
          python - <<'PY'
          import subprocess
          import sys

          allowed = {
              "database/benchmark_database.json",
              "database/generated/hardware.json",
              "database/generated/homepage.json",
              "database/generated/leaderboards.json",
              "database/generated/manifest.json",
          }

          result = subprocess.run(
              ["git", "status", "--porcelain"],
              check=True,
              capture_output=True,
              text=True,
          )

          unexpected = []

          for line in result.stdout.splitlines():
              path = line[3:].strip()

              if " -> " in path:
                  path = path.split(" -> ", 1)[1]

              if path == "import_work/" or path.startswith("import_work/"):
                  continue

              if path not in allowed:
                  unexpected.append(path)

          if unexpected:
              print("ERROR: Importer produced unexpected repository changes:")
              for path in unexpected:
                  print(f"  - {path}")
              sys.exit(1)

          print("Generated repository changes are within the approved allowlist.")
          PY

      - name: Create canonical import pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          BRANCH="import/$SUBMISSION_ID"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"

          git add database/benchmark_database.json database/generated/hardware.json database/generated/homepage.json database/generated/leaderboards.json database/generated/manifest.json

          if git diff --cached --quiet; then
            echo "ERROR: Canonical importer produced no staged database changes."
            exit 1
          fi

          git commit -m "Import approved submission $SUBMISSION_ID"
          git push --set-upstream origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" --title "Import approved submission $SUBMISSION_ID" --body "Automated canonical import for approved OpenLLMWorks submission $SUBMISSION_ID. The artifact was downloaded from R2, safely extracted, canonically validated, imported, and checked against the approved repository-change allowlist. This workflow does not merge the pull request or update D1 import/publish state."

      - name: Inspect generated repository changes
        run: |
          echo
          echo "============================================================"
          echo "APPROVED IMPORT WORKFLOW ? CONTROLLED IMPORT TEST"
          echo "============================================================"
          echo
          echo "The canonical maintainer importer completed successfully."
          echo
          echo "Repository changes generated by the importer:"
          echo

          git status --short
          echo
          git diff --stat
          echo
          echo "============================================================"
          echo "SAFETY BOUNDARY"
          echo "============================================================"
          echo "Canonical changes were committed and pushed to an isolated import branch."
          echo "A pull request was created; no merge or D1 import/publish state update was performed."
