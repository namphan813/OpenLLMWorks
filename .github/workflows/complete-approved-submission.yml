name: Complete Approved Submission Lifecycle

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  complete-lifecycle:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'import/sub_')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve import metadata
        id: metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          branch = os.environ.get("PR_BRANCH", "")

          submission_match = re.search(
              r"(?m)^Submission-ID:\s*(sub_[0-9a-fA-F-]+)\s*$",
              body,
          )

          result_match = re.search(
              r"(?m)^Result-ID:\s*(result_[0-9a-fA-F]+)\s*$",
              body,
          )

          generated_at_match = re.search(
              r"(?m)^Generated-At:\s*(\S+)\s*$",
              body,
          )

          if not submission_match:
              raise SystemExit(
                  "ERROR: PR body does not contain a valid Submission-ID."
              )

          if not result_match:
              raise SystemExit(
                  "ERROR: PR body does not contain a valid Result-ID."
              )

          if not generated_at_match:
              raise SystemExit(
                  "ERROR: PR body does not contain Generated-At."
              )

          submission_id = submission_match.group(1)
          result_id = result_match.group(1)
          generated_at = generated_at_match.group(1)

          expected_branch = f"import/{submission_id}"

          if branch != expected_branch:
              raise SystemExit(
                  "ERROR: PR branch does not match Submission-ID."
              )

          output_path = os.environ["GITHUB_OUTPUT"]

          with open(
              output_path,
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"submission_id={submission_id}\n"
              )
              output.write(
                  f"result_id={result_id}\n"
              )
              output.write(
                  f"generated_at={generated_at}\n"
              )

          print(f"Submission ID: {submission_id}")
          print(f"Result ID: {result_id}")
          print(f"Generated At: {generated_at}")
          print("Import PR metadata verified.")
          PY

      - name: Record import started
        env:
          CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ steps.metadata.outputs.submission_id }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"status":"importing"}' \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/lifecycle"

      - name: Record import completed
        env:
          CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ steps.metadata.outputs.submission_id }}
          RESULT_ID: ${{ steps.metadata.outputs.result_id }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"status\":\"imported\",\"result_id\":\"$RESULT_ID\"}" \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/lifecycle"

      - name: Record publishing started
        env:
          CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ steps.metadata.outputs.submission_id }}
          RESULT_ID: ${{ steps.metadata.outputs.result_id }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"status\":\"publishing\",\"result_id\":\"$RESULT_ID\"}" \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/lifecycle"

      - name: Verify production publication
        env:
          EXPECTED_GENERATED_AT: ${{ steps.metadata.outputs.generated_at }}
          EXPECTED_RESULT_ID: ${{ steps.metadata.outputs.result_id }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import json
          import os
          import time
          import urllib.request

          url = "https://openllmworks.com/hardware.json"
          expected = os.environ["EXPECTED_GENERATED_AT"]
          expected_result_id = os.environ["EXPECTED_RESULT_ID"]

          attempts = 30
          delay_seconds = 10

          expected_dt = datetime.fromisoformat(
              expected.replace("Z", "+00:00")
          )

          for attempt in range(1, attempts + 1):
              request = urllib.request.Request(
                  f"{url}?publication_check={int(time.time())}",
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "OpenLLMWorks-Publish-Check",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=20,
                  ) as response:
                      payload = json.load(response)

                  actual = payload.get("generatedAt")

                  print(
                      f"Attempt {attempt}/{attempts}: "
                      f"production generatedAt={actual}"
                  )

                  payload_text = json.dumps(
                      payload,
                      separators=(",", ":"),
                  )
                  result_present = (
                      expected_result_id in payload_text
                  )

                  print(
                      f"Result ID present: {result_present}"
                  )

                  generated_at_current = False

                  if actual:
                      try:
                          actual_dt = datetime.fromisoformat(
                              actual.replace("Z", "+00:00")
                          )

                          generated_at_current = (
                              actual_dt >= expected_dt
                          )
                      except ValueError as error:
                          print(
                              "Unable to parse production publication "
                              f"timestamp: {error}"
                          )

                  print(
                      "Production generatedAt satisfies expected "
                      f"publication: {generated_at_current}"
                  )

                  if (
                      generated_at_current
                      and result_present
                  ):
                      print(
                          "Production publication timestamp and result ID verified."
                      )
                      break

              except Exception as error:
                  print(
                      f"Attempt {attempt}/{attempts} failed: {error}"
                  )

              if attempt == attempts:
                  raise SystemExit(
                      "ERROR: Production did not expose the expected "
                      "generatedAt timestamp or result ID before timeout."
                  )

              time.sleep(delay_seconds)
          PY

      - name: Record published
        env:
          CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
          SUBMISSION_ID: ${{ steps.metadata.outputs.submission_id }}
          RESULT_ID: ${{ steps.metadata.outputs.result_id }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"status\":\"published\",\"result_id\":\"$RESULT_ID\"}" \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/lifecycle"
