name: Validate Incoming Submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Submission ID to validate (example: sub_6153889a-d98d-43a3-888d-d9a31b4094ce)"
        required: true
        type: string
      test_rejection:
        description: "Test rejection path by removing cpu.txt from the temporary extracted copy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate submission
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: openllmworks-submissions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show environment
        run: |
          echo "OpenLLMWorks submission validation"
          python --version
          pwd

      - name: Verify canonical validation modules
        run: |
          python -c "import parser.validate; print('Canonical submission validator module found.')"
          python -c "import parser.submission_archive; print('Submission archive module found.')"

      - name: Verify AWS CLI
        run: |
          aws --version

      - name: Validate submission ID
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          if [[ ! "$SUBMISSION_ID" =~ ^sub_[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Invalid submission ID: $SUBMISSION_ID"
            exit 1
          fi

          echo "Submission ID accepted: $SUBMISSION_ID"

      - name: Record validation started
        if: ${{ !inputs.test_rejection }}
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          VALIDATION_CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $VALIDATION_CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"status":"validating"}' \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/validation"

      - name: Download submission from R2
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          mkdir -p validation_work

          aws s3 cp \
            "s3://$R2_BUCKET/incoming/$SUBMISSION_ID.zip" \
            "validation_work/submission.zip" \
            --endpoint-url "$R2_ENDPOINT"

          test -s validation_work/submission.zip
          echo "Submission ZIP downloaded successfully."

      - name: Safely inspect and extract submission
        id: extract
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          from parser.submission_archive import (
              SubmissionArchiveError,
              extract_submission_archive,
          )

          archive_path = Path("validation_work/submission.zip")
          extract_root = Path("validation_work/extracted")

          try:
              result = extract_submission_archive(
                  archive_path,
                  extract_root,
              )
          except SubmissionArchiveError as error:
              raise SystemExit(str(error)) from error

          print(f"Archive size: {result.archive_size} bytes")
          print(
              "Uncompressed size: "
              f"{result.uncompressed_size} bytes"
          )
          print(f"Archive entries: {result.entry_count}")
          print(f"Submission directory: {result.submission_dir}")

          github_output = os.environ["GITHUB_OUTPUT"]

          with open(
              github_output,
              "a",
              encoding="utf-8",
          ) as output:
              print(
                  f"submission_dir={result.submission_dir}",
                  file=output,
              )
          PY

      - name: Run canonical submission validation
        if: ${{ !inputs.test_rejection }}
        env:
          SUBMISSION_DIR: ${{ steps.extract.outputs.submission_dir }}
        run: |
          echo "Running canonical validation against:"
          echo "$SUBMISSION_DIR"
          echo

          python -m parser.validate "$SUBMISSION_DIR"

      - name: Validation passed
        if: ${{ !inputs.test_rejection }}
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          echo
          echo "OpenLLMWorks canonical validation PASSED."
          echo "Submission: $SUBMISSION_ID"
          echo
          echo "No R2 objects were modified or moved."

      - name: Record validation passed
        if: ${{ success() && !inputs.test_rejection }}
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          VALIDATION_CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $VALIDATION_CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"status":"validated","validation_status":"passed"}' \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/validation"

      - name: Record validation failed
        if: ${{ failure() && !inputs.test_rejection }}
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
          VALIDATION_CALLBACK_TOKEN: ${{ secrets.VALIDATION_CALLBACK_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $VALIDATION_CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"status":"rejected","validation_error":"Validation workflow failed. Inspect the corresponding GitHub Actions run for details."}' \
            "https://api.openllmworks.com/v1/submissions/$SUBMISSION_ID/validation"

      - name: Prepare rejection-path test
        if: ${{ inputs.test_rejection }}
        env:
          SUBMISSION_DIR: ${{ steps.extract.outputs.submission_dir }}
        run: |
          echo "Preparing rejection-path test."
          echo "R2 object remains untouched."
          echo

          test -f "$SUBMISSION_DIR/cpu.txt"
          rm "$SUBMISSION_DIR/cpu.txt"

          if [[ -f "$SUBMISSION_DIR/cpu.txt" ]]; then
            echo "Failed to remove cpu.txt from temporary test copy."
            exit 1
          fi

          echo "Removed cpu.txt from temporary extracted copy."

      - name: Verify canonical validator rejects invalid submission
        if: ${{ inputs.test_rejection }}
        env:
          SUBMISSION_DIR: ${{ steps.extract.outputs.submission_dir }}
        run: |
          echo "Running canonical validator against intentionally invalid temporary copy..."
          echo

          set +e
          python -m parser.validate "$SUBMISSION_DIR"
          VALIDATION_EXIT_CODE=$?
          set -e

          echo
          echo "Validator exit code: $VALIDATION_EXIT_CODE"

          if [[ "$VALIDATION_EXIT_CODE" -eq 0 ]]; then
            echo "ERROR: Canonical validator unexpectedly accepted the invalid submission."
            exit 1
          fi

          echo
          echo "Canonical validator correctly REJECTED the invalid submission."

      - name: Rejection-path test passed
        if: ${{ inputs.test_rejection }}
        env:
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          echo
          echo "OpenLLMWorks rejection-path test PASSED."
          echo "Submission: $SUBMISSION_ID"
          echo "Temporary mutation: cpu.txt removed"
          echo "Expected result: REJECT"
          echo "Observed result: REJECT"
          echo
          echo "The production R2 object was not modified or moved."