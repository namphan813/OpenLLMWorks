name: Validate Incoming Submission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate submission
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Show environment
        run: |
          echo "OpenLLMWorks submission validation"
          python --version
          pwd

      - name: Verify validator source
        run: |
          test -f scripts/submission.py
          echo "Canonical submission validator source found."
